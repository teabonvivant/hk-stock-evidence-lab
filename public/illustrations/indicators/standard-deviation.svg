<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc"><title id="title">標準差：判讀次序</title><desc id="desc">選定比較窗口：只和同一標的、同一週期的近期數值比較，避免跨市場直接比絕對值。；判斷收窄或擴張：看 SD 是低於、接近還是高於近期常態。；方向交給價格：用突破、價格結構和成交量決定方向；波動只說明移動空間。；波動改變便重算：由收窄轉擴張或事件後回落時，要重新評估止蝕空間和倉位。</desc><rect width="720" height="800" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">標準差：判讀次序</tspan></text><path d="M67 284v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="160" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="189" r="15" fill="#0f766e"/><text x="63" y="195" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">1</tspan></text><text x="98" y="189" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">選定比較窗口</tspan></text><text x="98" y="218" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">只和同一標的、同一週期的近期數值比較，避免跨市場直接比</tspan><tspan x="98" dy="26">絕對值。</tspan></text><path d="M67 422v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="298" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="327" r="15" fill="#0f766e"/><text x="63" y="333" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">2</tspan></text><text x="98" y="327" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">判斷收窄或擴張</tspan></text><text x="98" y="356" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">看 SD 是低於、接近還是高於近期常態。</tspan></text><path d="M67 560v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="436" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="465" r="15" fill="#0f766e"/><text x="63" y="471" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">3</tspan></text><text x="98" y="465" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">方向交給價格</tspan></text><text x="98" y="494" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">用突破、價格結構和成交量決定方向；波動只說明移動空間。</tspan></text><rect x="40" y="574" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="603" r="15" fill="#0f766e"/><text x="63" y="609" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">4</tspan></text><text x="98" y="603" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">波動改變便重算</tspan></text><text x="98" y="632" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">由收窄轉擴張或事件後回落時，要重新評估止蝕空間和倉位。</tspan></text><path d="M40 765H680" stroke="#d5e2e0"/><text x="40" y="787" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc"><title id="title">相對強弱比較：判讀次序</title><desc id="desc">固定選股範圍和設定：所有標的使用相同市場、資料頻率、回看期和計算設定。；排序或找異常值：按 RSC 排序，建立較小的候選名單。；做第二輪檢查：檢查價格結構、成交流動性、事件風險和是否符合原來篩選目的。；另外建立交易計劃：篩選結果不等於入場；候選標的仍要獨立寫入場、失效和倉位。</desc><rect width="720" height="800" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">相對強弱比較：判讀次序</tspan></text><path d="M67 284v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="160" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="189" r="15" fill="#0f766e"/><text x="63" y="195" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">1</tspan></text><text x="98" y="189" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">固定選股範圍和設定</tspan></text><text x="98" y="218" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">所有標的使用相同市場、資料頻率、回看期和計算設定。</tspan></text><path d="M67 422v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="298" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="327" r="15" fill="#0f766e"/><text x="63" y="333" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">2</tspan></text><text x="98" y="327" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">排序或找異常值</tspan></text><text x="98" y="356" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">按 RSC 排序，建立較小的候選名單。</tspan></text><path d="M67 560v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="436" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="465" r="15" fill="#0f766e"/><text x="63" y="471" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">3</tspan></text><text x="98" y="465" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">做第二輪檢查</tspan></text><text x="98" y="494" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">檢查價格結構、成交流動性、事件風險和是否符合原來篩選目</tspan><tspan x="98" dy="26">的。</tspan></text><rect x="40" y="574" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="603" r="15" fill="#0f766e"/><text x="63" y="609" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">4</tspan></text><text x="98" y="603" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">另外建立交易計劃</tspan></text><text x="98" y="632" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">篩選結果不等於入場；候選標的仍要獨立寫入場、失效和倉位</tspan><tspan x="98" dy="26">。</tspan></text><path d="M40 765H680" stroke="#d5e2e0"/><text x="40" y="787" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc"><title id="title">移動平均包絡線：判讀次序</title><desc id="desc">判斷市況和邊界：分清價格正在橫行、趨勢延續還是波幅收窄，並標出上下邊界。；觀察位置和寬度：看價格在 MA Envelope 中間還是邊緣，通道正在收窄還是擴張。；等待收市確認：突破要等收市站穩及下一段延續；反轉要等價格回到通道內或形成轉向結構。；監察假突破：若價格突破後迅速回到原範圍，便取消突破假設。</desc><rect width="720" height="800" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">移動平均包絡線：判讀次序</tspan></text><path d="M67 284v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="160" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="189" r="15" fill="#0f766e"/><text x="63" y="195" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">1</tspan></text><text x="98" y="189" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">判斷市況和邊界</tspan></text><text x="98" y="218" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">分清價格正在橫行、趨勢延續還是波幅收窄，並標出上下邊界</tspan><tspan x="98" dy="26">。</tspan></text><path d="M67 422v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="298" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="327" r="15" fill="#0f766e"/><text x="63" y="333" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">2</tspan></text><text x="98" y="327" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">觀察位置和寬度</tspan></text><text x="98" y="356" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">看價格在 MA Envelope 中間還是邊緣，通道正在收窄還是</tspan><tspan x="98" dy="26">擴張。</tspan></text><path d="M67 560v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="436" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="465" r="15" fill="#0f766e"/><text x="63" y="471" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">3</tspan></text><text x="98" y="465" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">等待收市確認</tspan></text><text x="98" y="494" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">突破要等收市站穩及下一段延續；反轉要等價格回到通道內或</tspan><tspan x="98" dy="26">形成轉向結構。</tspan></text><rect x="40" y="574" width="640" height="124" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="603" r="15" fill="#0f766e"/><text x="63" y="609" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">4</tspan></text><text x="98" y="603" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">監察假突破</tspan></text><text x="98" y="632" font-size="20" font-weight="400" fill="#334155"><tspan x="98" dy="0">若價格突破後迅速回到原範圍，便取消突破假設。</tspan></text><path d="M40 765H680" stroke="#d5e2e0"/><text x="40" y="787" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

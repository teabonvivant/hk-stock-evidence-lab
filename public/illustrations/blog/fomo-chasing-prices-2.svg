<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">由急迫感回到可核對的決定</title><desc id="desc">辨認刺激：急升、群組或盈利截圖；查原始資料：確認有甚麼新事實；重算條件：入市、退出、數量與成本；容許不參與：超出範圍便保留觀察</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">由急迫感回到可核對的決定</tspan></text><path d="M67 245v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="158" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="187" r="15" fill="#0f766e"/><text x="63" y="193" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">1</tspan></text><text x="98" y="187" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">辨認刺激</tspan></text><text x="98" y="216" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">急升、群組或盈利截圖</tspan></text><path d="M67 346v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="259" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="288" r="15" fill="#0f766e"/><text x="63" y="294" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">2</tspan></text><text x="98" y="288" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">查原始資料</tspan></text><text x="98" y="317" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">確認有甚麼新事實</tspan></text><path d="M67 447v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="360" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="389" r="15" fill="#0f766e"/><text x="63" y="395" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">3</tspan></text><text x="98" y="389" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">重算條件</tspan></text><text x
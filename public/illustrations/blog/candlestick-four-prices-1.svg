<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">一支燭的四個價格：教學算例</title><desc id="desc">開市：實體其中一端，數值 10；最高：上影通往的極值，數值 11；最低：下影通往的極值，數值 9.5；收市：實體另一端，數值 10.8</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">一支燭的四個價格：教學算例</tspan></text><path d="M320 156V562" stroke="#a8b9b8" stroke-dasharray="3 5"/><text x="40" y="179" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">開市</tspan></text><text x="40" y="207" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">實體其中一端</tspan></text><rect x="320" y="187" width="280" height="25" rx="2" fill="#0f766e"/><text x="320" y="176" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">10</tspan></text><text x="40" y="280" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">最高</tspan></text><text x="40" y="308" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">上影通往的極值</tspan></text><rect x="320" y="288" width="308" height="25" rx="2" fill="#0f766e"/><text x="320" y="277" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">11</tspan></text><text x="40" y="381" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">最低</tspan></text><text x="40" y="409" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">下影通往的極值</tspan></text><rect x="320" y="389" width="266" height="25" rx="2" fill="#0f766e"/><text x="320" y="378" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">9.5</tspan></text><text x="40" y="482" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">收市</tspan></text><text x="40" y="510" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">實體另一端</tspan></text><rect x="320" y="490" width="302.400
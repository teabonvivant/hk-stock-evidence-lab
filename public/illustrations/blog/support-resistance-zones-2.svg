<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">盤中低位與收市位置</title><desc id="d">教學圖解，數值取自文章中的假設算例，不代表實際市場行情。</desc><rect width="720" height="480" fill="#f5f7f9"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif" fill="#142536"><text x="40" y="46" font-size="24" font-weight="700" fill="#142536">盤中低位與收市位置，回答不同問題</text><text x="40" y="79" font-size="16" font-weight="500" fill="#506174">同一假設下緣：9.8 元</text><line x1="90" y1="155" x2="640" y2="155" stroke="#285f96" stroke-width="2" stroke-dasharray="7 5"/><text x="92" y="143" font-size="15" fill="#285f96">區域下緣 9.8</text><line x1="120" y1="320" x2="620" y2="320" stroke="#dce4ea"/><text x="120" y="350" font-size="17">盤中低位：9.7</text><circle cx="310" cy="155" r="9" fill="#fff" stroke="#b45309" stroke-width="3"/><path d="M310 164V250" stroke="#b45309" stroke-width="2"/><circle cx="310" cy="250" r="8" fill="#185bd1"/><text x="340" y="246" font-size="17" font-weight="700">收市：10.0，回到區內</text><rect x="80" y="386" width="560" height="38" rx="4" fill="#eaf0f5"/><text x="98" y="411" font-size="16">另一天收市 9.6：符合事先訂下的收市失守條件</text><text x="40" y="452" font-size="14" fill="#506174">港股證據研究室　·　教學示意，非實際行情</text></g></svg>

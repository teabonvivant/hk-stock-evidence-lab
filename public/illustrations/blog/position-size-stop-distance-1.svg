<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">由風險預算計出理論股數</title><desc id="d">教學圖解，數值取自文章中的假設算例，不代表實際市場行情。</desc><rect width="720" height="480" fill="#f5f7f9"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif" fill="#142536"><text x="40" y="46" font-size="24" font-weight="700" fill="#142536">先定風險預算，再計理論股數</text><text x="40" y="78" font-size="15" font-weight="500" fill="#506174">教學算例　·　未計費用、差價及滑價</text><rect x="48" y="115" width="170" height="105" fill="#eaf0f5"/><rect x="275" y="115" width="170" height="105" fill="#eaf0f5"/><rect x="502" y="115" width="170" height="105" fill="#eaf0f5"/><text x="68" y="151" font-size="16">風險預算</text><text x="68" y="191" font-size="27" font-weight="700" fill="#185bd1">1,000 元</text><text x="295" y="151" font-size="16">每股距離</text><text x="295" y="191" font-size="27" font-weight="700">20 − 19 = 1</text><text x="522" y="151" font-size="16">理論數量</text><text x="522" y="191" font-size="27" font-weight="700" fill="#185bd1">1,000 股</text><path d="M218 168h48m-7-7 7 7-7 7M445 168h48m-7-7 7 7-7 7" stroke="#506174" fill="none" stroke-width="2"/><text x="70" y="281" font-size="19">股數 = 風險預算 ÷（入市價 − 止蝕價）</text><line x1="70" y1="306" x2="650" y2="306" stroke="#dce4ea"/><text x="70" y="351" font-size="17">名義投入：1,000 × 20 = 20,000 元</text><text x="70" y="389" font-size="16" fill="#b45309">若以 18.8 元退出，每股損失 1.2 元，合計 1,200 元</text><text x="40" y="452" font-size="14" fill="#506174">港股證據研究室　·　教學示意，非實際行情</text></g></svg>

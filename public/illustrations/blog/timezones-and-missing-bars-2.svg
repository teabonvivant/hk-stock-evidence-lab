<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">處理一段缺燭的次序</title><desc id="desc">對照日曆：是否休市、提早收市或停牌；核對供應：確認成交、報價及來源狀態；標記缺口：保留原始空白與補值區別；套用政策：按預先約定處理訊號與成交</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">處理一段缺燭的次序</tspan></text><path d="M67 245v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="158" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="187" r="15" fill="#0f766e"/><text x="63" y="193" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">1</tspan></text><text x="98" y="187" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">對照日曆</tspan></text><text x="98" y="216" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">是否休市、提早收市或停牌</tspan></text><path d="M67 346v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="259" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="288" r="15" fill="#0f766e"/><text x="63" y="294" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">2</tspan></text><text x="98" y="288" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">核對供應</tspan></text><text x="98" y="317" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">確認成交、報價及來源狀態</tspan></text><path d="M67 447v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="360" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="389" r="15" fill="#0f766e"/><text x="63" y="395" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">3</tspan></text><text x="98" y="389" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">標記缺口</tspan></text><text x="98" y="418" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">保留原始空白與補值區別</tspan></text><rect x="40" y="461" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="490" r="15" fill="#0f766e"/><text x="63" y="496" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">4</tspan></text><text x="98" y="490" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">套用政策</tspan></text><text x="98" y="519" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">按預先約定處理訊號與成交</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">教學算例：止蝕估計與缺口損失</title><desc id="desc">9.50元退出：每股損失0.50元，數值 500；9.20元退出：每股損失0.80元，數值 800；9.00元退出：每股損失1元，數值 1000</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">教學算例：止蝕估計與缺口損失</tspan></text><path d="M320 156V562" stroke="#a8b9b8" stroke-dasharray="3 5"/><text x="40" y="179" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">9.50元退出</tspan></text><text x="40" y="207" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">每股損失0.50元</tspan></text><rect x="320" y="187" width="154" height="25" rx="2" fill="#0f766e"/><text x="320" y="176" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">500</tspan></text><text x="40" y="313.66666666666663" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">9.20元退出</tspan></text><text x="40" y="341.66666666666663" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">每股損失0.80元</tspan></text><rect x="320" y="321.66666666666663" width="246.39999999999998" height="25" rx="2" fill="#0f766e"/><text x="320" y="310.66666666666663" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">800</tspan></text><text x="40" y="448.3333333333333" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">9.00元退出</tspan></text><text x="40" y="476.3333333333333" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">每股損失1元</tspan></text><rect x="320" y="456.3333333333333" width="308" height="25" rx="2" fill="#0f766e"/><text x="320" y="445.3333333333333" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">1000</tspan></text><text x="40" y="584" font-size="15" font-weight="400" fill="#52636b"><tspan x="40" dy="0">數值按同一比例繪製；單位及假設見圖說。</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

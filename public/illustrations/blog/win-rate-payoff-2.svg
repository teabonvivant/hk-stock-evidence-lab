<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">閱讀勝率時一併核對</title><desc id="desc">交易單位：按整筆持倉或分批成交統計；平手定義：是否扣費後才判斷；盈虧幅度：平均值與極端值一起看；未完成持倉：不能只展示已獲利的交易</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">閱讀勝率時一併核對</tspan></text><rect x="40" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 177h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">交易單位</tspan></text><text x="58" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">按整筆持倉或分批成交統計</tspan></text><rect x="369" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 177h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">平手定義</tspan></text><text x="387" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">是否扣費後才判斷</tspan></text><rect x="40" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 388h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">盈虧幅度</tspan></text><text x="58" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">平均值與極端值一起看</tspan></text><rect x="369" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 388h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">未完成持倉</tspan></text><text x="387" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">不能只展示已獲利的交易</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

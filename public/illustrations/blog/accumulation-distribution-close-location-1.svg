<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">跌市中的正貢獻：教學算例</title><desc id="desc">昨日收市：跨日比較的起點，數值 15；今日最高：本期區間上緣，數值 12；今日收市：位置係數為正零點五，數值 11.5；今日最低：本期區間下緣，數值 10</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">跌市中的正貢獻：教學算例</tspan></text><path d="M320 156V562" stroke="#a8b9b8" stroke-dasharray="3 5"/><text x="40" y="179" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">昨日收市</tspan></text><text x="40" y="207" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">跨日比較的起點</tspan></text><rect x="320" y="187" width="308" height="25" rx="2" fill="#0f766e"/><text x="320" y="176" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">15</tspan></text><text x="40" y="280" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">今日最高</tspan></text><text x="40" y="308" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">本期區間上緣</tspan></text><rect x="320" y="288" width="246.39999999999998" height="25" rx="2" fill="#0f766e"/><text x="320" y="277" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">12</tspan></text><text x="40" y="381" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">今日收市</tspan></text><text x="40" y="409" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">位置係數為正零點五</tspan></text><rect x="320" y="389" width="236.13333333333333" height="25" rx="2" fill="#0f766e"/><text x="320" y="378" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">11.5</tspan></text><text x="40" y="482" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">今日最低</tspan></text><text x="40" y="510" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">本期區間下緣<
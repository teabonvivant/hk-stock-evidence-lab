<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">一般全日市的交易時段</title><desc id="d">香港時間的一般全日市交易時段示意；適用證券及當日安排須按香港交易所資料核對。</desc><rect width="720" height="480" fill="#f5f7f9"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif" fill="#142536"><text x="40" y="46" font-size="24" font-weight="700" fill="#142536">一般全日市的時段與空檔</text><text x="40" y="78" font-size="15" font-weight="500" fill="#506174">香港時間　·　適用證券與當日安排須另核對</text><line x1="64" y1="189" x2="664" y2="189" stroke="#a9b8c7" stroke-width="2"/><rect x="64" y="136" width="94" height="72" fill="#eaf0f5" stroke="#fff"/><text x="70" y="160" font-size="14" font-weight="700">09:00–09:30</text><text x="70" y="194" font-size="14">開市前</text><rect x="158" y="136" width="203" height="72" fill="#eaf0f5" stroke="#fff"/><text x="164" y="160" font-size="14" font-weight="700">09:30–12:00</text><text x="164" y="194" font-size="14">早市</text><rect x="361" y="150" width="72" height="72" fill="#e3e8ee" stroke="#fff"/><text x="367" y="160" font-size="14" font-weight="700">12:00</text><text x="367" y="194" font-size="14">休市</text><rect x="433" y="136" width="176" height="72" fill="#eaf0f5" stroke="#fff"/><text x="439" y="160" font-size="14" font-weight="700">13:00–16:00</text><text x="439" y="194" font-size="14">午市</text><rect x="609" y="136" width="55" height="72" fill="#dbe8f5" stroke="#fff"/><text x="615" y="160" font-size="12" font-weight="700">16:00</text><text x="615" y="194" font-size="12">競價</text><text x="64" y="258" font-size="16" font-weight="700">收市競價於 16:00 開始；16:08 至 16:10 之間隨機收市</text><line x1="64" y1="293" x2="664" y2="293" stroke="#dce4ea"/><text x="64" y="332" font-size="16">午間休市 12:00–13:00；普通股份沒有持續交易。</text><text x="64" y="367" font-size="16">時段分界會影響報價更新與委託處理，不代表價格停止變動風險。</text><text x="40" y="452" font-size="14" fill="#506174">港股證據研究室　·　香港時間，以港交所公布安排為準</text></g></svg>

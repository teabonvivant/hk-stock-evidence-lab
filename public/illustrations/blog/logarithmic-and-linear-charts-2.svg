<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">兩把尺的等距定義</title><desc id="desc">線性等距：每格相同金額差距；對數等距：每格相同倍數變化；線性直線：等時間增加相同金額；對數直線：等時間按相同比例改變</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">兩把尺的等距定義</tspan></text><rect x="40" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 177h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">線性等距</tspan></text><text x="58" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">每格相同金額差距</tspan></text><rect x="369" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 177h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">對數等距</tspan></text><text x="387" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">每格相同倍數變化</tspan></text><rect x="40" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 388h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">線性直線</tspan></text><text x="58" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">等時間增加相同金額</tspan></text><rect x="369" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 388h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">對數直線</tspan></text><text x="387" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">等時間按相同比例改變</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">由平均升跌幅計算 RSI 75</title><desc id="d">教學圖解，數值取自文章中的假設算例，不代表實際市場行情。</desc><rect width="720" height="480" fill="#f5f7f9"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif" fill="#142536"><text x="40" y="46" font-size="24" font-weight="700" fill="#142536">由平滑平均升跌幅計算 RSI</text><rect x="50" y="102" width="280" height="100" rx="5" fill="#eaf0f5"/><rect x="390" y="102" width="280" height="100" rx="5" fill="#eaf0f5"/><text x="72" y="139" font-size="17" font-weight="700" fill="#142536">平均升幅</text><text x="72" y="177" font-size="27" font-weight="700" fill="#185bd1">0.3 元</text><text x="412" y="139" font-size="17" font-weight="700" fill="#142536">平均跌幅</text><text x="412" y="177" font-size="27" font-weight="700" fill="#b45309">0.1 元</text><text x="70" y="259" font-size="20">相對比率 = 0.3 ÷ 0.1 = 3</text><line x1="70" y1="281" x2="650" y2="281" stroke="#dce4ea"/><text x="70" y="327" font-size="19">RSI = 100 − 100 ÷ (1 + 3)</text><text x="70" y="389" font-size="32" font-weight="700" fill="#185bd1">= 75</text><text x="184" y="387" font-size="16" fill="#506174">教學算例；平滑方法會影響結果</text><text x="40" y="452" font-size="14" fill="#506174">港股證據研究室　·　教學示意，非實際行情</text></g></svg>

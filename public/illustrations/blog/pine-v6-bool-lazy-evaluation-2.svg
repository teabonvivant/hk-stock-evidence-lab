<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">依賴歷史的計算如何安排</title><desc id="desc">每根更新：在適當範圍計算指標；形成事件：由連續序列判斷所需轉變；合併條件：再加入時段與確認限制；檢查行為：核對值、事件與訂單次序</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">依賴歷史的計算如何安排</tspan></text><path d="M67 245v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="158" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="187" r="15" fill="#0f766e"/><text x="63" y="193" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">1</tspan></text><text x="98" y="187" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">每根更新</tspan></text><text x="98" y="216" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">在適當範圍計算指標</tspan></text><path d="M67 346v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="259" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="288" r="15" fill="#0f766e"/><text x="63" y="294" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">2</tspan></text><text x="98" y="288" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">形成事件</tspan></text><text x="98" y="317" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">由連續序列判斷所需轉變</tspan></text><path d="M67 447v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="360" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="389" r="15" fill="#0f766e"/><text x="63" y="395" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">3</tspan></text><text x="98" y="389" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">合併條件</tspan></text><text x="98" y="418" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">再加入時段與確認限制</tspan></text><rect x="40" y="461" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="490" r="15" fill="#0f766e"/><text x="63" y="496" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">4</tspan></text><text x="98" y="490" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">檢查行為</tspan></text><text x="98" y="519" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">核對值、事件與訂單次序</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

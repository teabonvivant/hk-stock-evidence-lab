<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">同一天的兩條上軌</title><desc id="desc">此前上軌：截至昨日最高二十二元；今日收市：二十二點八元，超過舊上軌；含今日上軌：納入今日最高後為二十三元；突破比較：應先說是否排除當期</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">同一天的兩條上軌</tspan></text><rect x="40" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 177h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">此前上軌</tspan></text><text x="58" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">截至昨日最高二十二元</tspan></text><rect x="369" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 177h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">今日收市</tspan></text><text x="387" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">二十二點八元，超過舊上軌</tspan></text><rect x="40" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 388h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">含今日上軌</tspan></text><text x="58" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">納入今日最高後為二十三元</tspan></text><rect x="369" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 388h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">突破比較</tspan></text><text x="387" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">應先說是否排除當期</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">止蝕距離與理論股數</title><desc id="d">教學圖解，數值取自文章中的假設算例，不代表實際市場行情。</desc><rect width="720" height="480" fill="#f5f7f9"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif" fill="#142536"><text x="40" y="46" font-size="24" font-weight="700" fill="#142536">止蝕距離改變，理論數量也改變</text><text x="40" y="78" font-size="15" font-weight="500" fill="#506174">同一 1,000 元風險預算　·　教學算例</text><text x="54" y="151" font-size="17" font-weight="700">入市 20　止蝕 19</text><text x="54" y="179" font-size="14" fill="#506174">每股距離 1 元 → 1,000 股</text><rect x="260" y="127" width="430" height="31" fill="#dcebf1"/><line x1="260" y1="160" x2="660" y2="160" stroke="#a9b8c7"/><text x="54" y="246" font-size="17" font-weight="700">入市 20　止蝕 19.5</text><text x="54" y="274" font-size="14" fill="#506174">每股距離 0.5 元 → 2,000 股</text><rect x="260" y="222" width="215" height="31" fill="#dcebf1"/><line x1="260" y1="255" x2="660" y2="255" stroke="#a9b8c7"/><rect x="52" y="328" width="616" height="70" fill="#fff" stroke="#dce4ea"/><text x="72" y="359" font-size="16">股數向下取整至可執行手數；近止蝕不代表較低風險。</text><text x="72" y="383" font-size="15" fill="#506174">裂口或較差成交可令實際虧損超出估算。</text><text x="40" y="452" font-size="14" fill="#506174">港股證據研究室　·　教學示意，非實際行情</text></g></svg>

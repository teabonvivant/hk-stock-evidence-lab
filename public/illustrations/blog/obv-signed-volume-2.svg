<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">這個加減法保留與省略的事</title><desc id="desc">保留成交量：大量成交帶來較大加減項；保留收市方向：與前一個收市比較；省略升跌幅：升一毫與一元可同樣加量；省略參與者：不能辨認機構或散戶</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">這個加減法保留與省略的事</tspan></text><rect x="40" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 177h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">保留成交量</tspan></text><text x="58" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">大量成交帶來較大加減項</tspan></text><rect x="369" y="158" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 177h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="209" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">保留收市方向</tspan></text><text x="387" y="246" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">與前一個收市比較</tspan></text><rect x="40" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M58 388h30" stroke="#0f766e" stroke-width="3"/><text x="58" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="58" dy="0">省略升跌幅</tspan></text><text x="58" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="58" dy="0">升一毫與一元可同樣加量</tspan></text><rect x="369" y="369" width="311" height="193" rx="7" fill="#ffffff" stroke="#d5e2e0"/><path d="M387 388h30" stroke="#0f766e" stroke-width="3"/><text x="387" y="420" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="387" dy="0">省略參與者</tspan></text><text x="387" y="457" font-size="20" font-weight="400" fill="#334155"><tspan x="387" dy="0">不能辨認機構或散戶</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">報價更新與委託狀態</title><desc id="d">休市、重開與券商委託狀態的流程示意；各券商介面及處理時間可能不同。</desc><rect width="720" height="480" fill="#f5f7f9"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif" fill="#142536"><text x="40" y="46" font-size="24" font-weight="700" fill="#142536">先分清報價更新與委託狀態</text><text x="40" y="78" font-size="15" font-weight="500" fill="#506174">示意流程，不代表所有券商介面</text><rect x="46" y="151" width="145" height="138" fill="#fff" stroke="#dce4ea"/><circle cx="68" cy="176" r="7" fill="#285f96"/><text x="60" y="215" font-size="18" font-weight="700" fill="#142536">休市中</text><text x="60" y="254" font-size="14">畫面可能保留上一口價</text><path d="M194 220h16m-5-5 5 5-5 5" stroke="#506174" fill="none" stroke-width="2"/><rect x="211" y="151" width="145" height="138" fill="#fff" stroke="#dce4ea"/><circle cx="233" cy="176" r="7" fill="#285f96"/><text x="225" y="215" font-size="18" font-weight="700" fill="#142536">新時段</text><text x="225" y="254" font-size="14">市場重新接受及撮合</text><path d="M359 220h16m-5-5 5 5-5 5" stroke="#506174" fill="none" stroke-width="2"/><rect x="376" y="151" width="145" height="138" fill="#fff" stroke="#dce4ea"/><circle cx="398" cy="176" r="7" fill="#285f96"/><text x="390" y="215" font-size="18" font-weight="700" fill="#142536">券商已接收</text><text x="390" y="254" font-size="14">收到指示，不等於成交</text><path d="M524 220h16m-5-5 5 5-5 5" stroke="#506174" fill="none" stroke-width="2"/><rect x="541" y="151" width="145" height="138" fill="#fff" stroke="#dce4ea"/><circle cx="563" cy="176" r="7" fill="#18794e"/><text x="555" y="215" font-size="18" font-weight="700" fill="#142536">成交回報</text><text x="555" y="254" font-size="14">查看實際價格與數量</text><rect x="66" y="340" width="588" height="60" fill="#eaf0f5"/><text x="84" y="376" font-size="16" font-weight="700">顯示「已接收」時，仍要等成交回報確認是否成交</text><text x="40" y="452" font-size="14" fill="#506174">港股證據研究室　·　委託流程示意，以券商實際狀態為準</text></g></svg>

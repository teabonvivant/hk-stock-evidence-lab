<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">教學算例：三筆風險會相加</title><desc id="desc">持倉甲：估計1,000元，數值 1000；持倉乙：估計1,000元，數值 1000；持倉丙：估計1,000元，數值 1000；組合合計：三項共3,000元，數值 3000</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">教學算例：三筆風險會相加</tspan></text><path d="M320 156V562" stroke="#a8b9b8" stroke-dasharray="3 5"/><text x="40" y="179" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">持倉甲</tspan></text><text x="40" y="207" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">估計1,000元</tspan></text><rect x="320" y="187" width="102.66666666666663" height="25" rx="2" fill="#0f766e"/><text x="320" y="176" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">1000</tspan></text><text x="40" y="280" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">持倉乙</tspan></text><text x="40" y="308" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">估計1,000元</tspan></text><rect x="320" y="288" width="102.66666666666663" height="25" rx="2" fill="#0f766e"/><text x="320" y="277" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">1000</tspan></text><text x="40" y="381" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">持倉丙</tspan></text><text x="40" y="409" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">估計1,000元</tspan></text><rect x="320" y="389" width="102.66666666666663" height="25" rx="2" fill="#0f766e"/><text x="320" y="378" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">1000</tspan></text><text x="40" y="482" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">組合合計</tspan></text><text x="40" y="510" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">三項共3,000元</tspan></text><rect x="320" y="490" width="308" height="25" rx="2" fill="#0f766e"/><text x="320" y="479" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">3000</tspan></text><text x="40" y="584" font-size="15" font-weight="400" fill="#52636b"><tspan x="40" dy="0">數值按同一比例繪製；單位及假設見圖說。</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">教學算例：加倍風險如何擴張</title><desc id="desc">第一次：風險100元，數值 100；第二次：風險200元，數值 200；第三次：風險400元，數值 400；第四次：風險800元，數值 800；第五次：風險1,600元，數值 1600</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">教學算例：加倍風險如何擴張</tspan></text><path d="M320 156V562" stroke="#a8b9b8" stroke-dasharray="3 5"/><text x="40" y="179" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">第一次</tspan></text><text x="40" y="207" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">風險100元</tspan></text><rect x="320" y="187" width="19.25" height="25" rx="2" fill="#0f766e"/><text x="320" y="176" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">100</tspan></text><text x="40" y="259.8" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">第二次</tspan></text><text x="40" y="287.8" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">風險200元</tspan></text><rect x="320" y="267.8" width="38.5" height="25" rx="2" fill="#0f766e"/><text x="320" y="256.8" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">200</tspan></text><text x="40" y="340.6" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">第三次</tspan></text><text x="40" y="368.6" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">風險400元</tspan></text><rect x="320" y="348.6" width="77" height="25" rx="2" fill="#0f766e"/><text x="320" y="337.6" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">400</tspan></text><text x="40" y="421.4" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">第四次</tspan></text><text x="40" y="449.4" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">風險800元</tspan></text><rect x="320" y="429.4" width="154" height="25" rx="2" fill="#0f766e"/><text x="320" y="418.4" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">800</tspan></text><text x="40" y="502.2" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">第五次</tspan></text><text x="40" y="530.2" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">風險1,600元</tspan></text><rect x="320" y="510.2" width="308" height="25" rx="2" fill="#0f766e"/><text x="320" y="499.2" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">1600</tspan></text><text x="40" y="584" font-size="15" font-weight="400" fill="#52636b"><tspan x="40" dy="0">數值按同一比例繪製；單位及假設見圖說。</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

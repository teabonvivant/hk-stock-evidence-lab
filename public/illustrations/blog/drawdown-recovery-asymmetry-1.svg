<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">教學算例：回到原位所需升幅</title><desc id="desc">先跌20%：由80回到100，要升25%，數值 25；先跌50%：由50回到100，要升100%，數值 100；先跌75%：由25回到100，要升300%，數值 300</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">教學算例：回到原位所需升幅</tspan></text><path d="M320 156V562" stroke="#a8b9b8" stroke-dasharray="3 5"/><text x="40" y="179" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">先跌20%</tspan></text><text x="40" y="207" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">由80回到100，要升25%</tspan></text><rect x="320" y="187" width="25.666666666666686" height="25" rx="2" fill="#0f766e"/><text x="320" y="176" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">25</tspan></text><text x="40" y="313.66666666666663" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">先跌50%</tspan></text><text x="40" y="341.66666666666663" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">由50回到100，要升100%</tspan></text><rect x="320" y="321.66666666666663" width="102.66666666666663" height="25" rx="2" fill="#0f766e"/><text x="320" y="310.66666666666663" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">100</tspan></text><text x="40" y="448.3333333333333" font-size="21" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">先跌75%</tspan></text><text x="40" y="476.3333333333333" font-size="17" font-weight="400" fill="#334155"><tspan x="40" dy="0">由25回到100，要升300%</tspan></text><rect x="320" y="456.3333333333333" width="308" height="25" rx="2" fill="#0f766e"/><text x="320" y="445.3333333333333" font-size="19" font-weight="700" fill="#0b1f33"><tspan x="320" dy="0">300</tspan></text><text x="40" y="584" font-size="15" font-weight="400" fill="#52636b"><tspan x="40" dy="0">數值按同一比例繪製；單位及假設見圖說。</tspan></text><path d="M40 605H680" stroke="#d5e2e0"/><text x="40" y="627" font-size="14" font-weight="400" fill="#52636b"><tspan x="40" dy="0">港股證據研究室</tspan></text></g></svg>

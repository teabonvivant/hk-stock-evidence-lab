<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">價格與 RSI 在強勢時的關係</title><desc id="d">教學圖解，數值取自文章中的假設算例，不代表實際市場行情。</desc><rect width="720" height="480" fill="#f5f7f9"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif" fill="#142536"><text x="40" y="46" font-size="24" font-weight="700" fill="#142536">價格創高時，RSI 可在 70 以上停留</text><text x="40" y="78" font-size="15" font-weight="500" fill="#506174">同一時間軸　·　假設走勢</text><text x="48" y="128" font-size="16" font-weight="700">價格</text><line x1="100" y1="205" x2="660" y2="205" stroke="#dce4ea"/><polyline points="105,192 174,178 235,184 302,156 363,164 428,133 494,142 558,107 642,88" fill="none" stroke="#185bd1" stroke-width="4" stroke-linejoin="round"/><text x="585" y="78" font-size="15" fill="#185bd1">高位提高</text><line x1="100" y1="329" x2="660" y2="329" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5"/><text x="52" y="286" font-size="16" font-weight="700">RSI</text><text x="664" y="334" font-size="14" fill="#b45309">70</text><polyline points="105,361 174,337 235,319 302,310 363,292 428,299 494,280 558,271 642,260" fill="none" stroke="#18794e" stroke-width="4" stroke-linejoin="round"/><text x="480" y="249" font-size="15" fill="#18794e">高於 70，並非上限</text><text x="100" y="399" font-size="14" fill="#506174">前段　　時間　　後段</text><text x="40" y="452" font-size="14" fill="#506174">港股證據研究室　·　教學示意，非實際行情</text></g></svg>

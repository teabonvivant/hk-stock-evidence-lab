<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc"><title id="title">分段退出的數量核對</title><desc id="desc">持有十單位：確認模擬持倉總量；第一組六單位：明列該組止賺及止蝕；第二組四單位：管理尚未分配的餘額；成交後對照：檢查餘倉與仍有效的訂單</desc><rect width="720" height="640" fill="#f4f7f7"/><g font-family="Microsoft JhengHei,PingFang HK,Noto Sans HK,sans-serif"><text x="40" y="90" font-size="29" font-weight="700" fill="#0b1f33"><tspan x="40" dy="0">分段退出的數量核對</tspan></text><path d="M67 245v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="158" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="187" r="15" fill="#0f766e"/><text x="63" y="193" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">1</tspan></text><text x="98" y="187" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">持有十單位</tspan></text><text x="98" y="216" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">確認模擬持倉總量</tspan></text><path d="M67 346v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="259" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="288" r="15" fill="#0f766e"/><text x="63" y="294" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">2</tspan></text><text x="98" y="288" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">第一組六單位</tspan></text><text x="98" y="317" font-size="21" font-weight="400" fill="#334155"><tspan x="98" dy="0">明列該組止賺及止蝕</tspan></text><path d="M67 447v14m-4-5 4 5 4-5" stroke="#0f766e" stroke-width="2" fill="none"/><rect x="40" y="360" width="640" height="87" rx="7" fill="#ffffff" stroke="#d5e2e0"/><circle cx="68" cy="389" r="15" fill="#0f766e"/><text x="63" y="395" font-size="17" font-weight="700" fill="#fff"><tspan x="63" dy="0">3</tspan></text><text x="98" y="389" font-size="23" font-weight="700" fill="#0b1f33"><tspan x="98" dy="0">第二組四單位</tspan></text><text x